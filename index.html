<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Whiteboard</title>
<style>
:root{--bar:#1d2330;--fg:#e8ecf4;--btn:#2a3244;--on:#3b5bdb}
html,body{margin:0;height:100%;overflow:hidden;background:#fdfdfc;font:13px system-ui,sans-serif;overscroll-behavior:none}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--bar);color:var(--fg);overflow-x:auto;white-space:nowrap}
button{font:inherit;color:inherit;background:var(--btn);border:0;border-radius:6px;padding:6px 9px;min-height:32px;cursor:pointer;flex:none}
button.on{background:var(--on)}
button:focus-visible{outline:2px solid #9db4ff}
.sep{width:1px;align-self:stretch;background:#3c465c;flex:none}
.sw{width:24px;height:24px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#fff;background-clip:padding-box}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
#sym{position:fixed;top:48px;left:8px;z-index:6;display:none;grid-template-columns:repeat(8,38px);gap:4px;padding:8px;background:var(--bar);border-radius:8px}
#sym button{font-size:20px;padding:0;height:38px}
#ti{position:fixed;display:none;z-index:7;border:1px dashed #3b5bdb;background:#fff;outline:0;padding:0 4px;margin:0;min-width:80px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bar);color:var(--fg);padding:8px 12px;border-radius:8px;display:none;z-index:8}
</style></head><body>
<div id="bar"></div><div id="sym"></div>
<canvas id="cv"></canvas><input id="ti" autocomplete="off"><div id="toast"></div>
<script src="dist.js"></script>
<script id="geo">
function segD(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function rdp(p,e){if(p.length<3)return p;var a=p[0],b=p[p.length-1],mi=0,md=-1;for(var i=1;i<p.length-1;i++){var d=segD(p[i][0],p[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;mi=i;}}if(md<=e)return [a,b];return rdp(p.slice(0,mi+1),e).slice(0,-1).concat(rdp(p.slice(mi),e));}
function smoothPts(p){var o=[p[0]];for(var i=1;i<p.length-1;i++){var a=p[i-1],b=p[i],c=p[i+1];o.push([(a[0]+2*b[0]+c[0])/4,(a[1]+2*b[1]+c[1])/4,b[2]]);}o.push(p[p.length-1]);return o;}
function tidy(p){var q=smoothPts(smoothPts(p)),o=[q[0]];for(var i=1;i<q.length;i++){var l=o[o.length-1];if(Math.hypot(q[i][0]-l[0],q[i][1]-l[1])>=2||i===q.length-1)o.push(q[i]);}return o;}
function poly(pts,c,w){return{t:'s',p:pts.map(function(q){return[q[0],q[1],.5];}),c:c,w:w,cl:true,sh:true};}
function recognize(p,col,w){
 if(p.length<5)return null;
 var mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 p.forEach(function(q){mnx=Math.min(mnx,q[0]);mxx=Math.max(mxx,q[0]);mny=Math.min(mny,q[1]);mxy=Math.max(mxy,q[1]);});
 var bw=mxx-mnx,bh=mxy-mny,diag=Math.hypot(bw,bh);if(diag<24)return null;
 var a=p[0],b=p[p.length-1],gap=Math.hypot(a[0]-b[0],a[1]-b[1]);
 if(gap>diag*.55){var md=0;p.forEach(function(q){md=Math.max(md,segD(q[0],q[1],a[0],a[1],b[0],b[1]));});
  return md/gap<.08?{t:'h',k:'line',x1:a[0],y1:a[1],x2:b[0],y2:b[1],c:col,w:w}:null;}
 if(gap>diag*.3)return null;
 var cx=(mnx+mxx)/2,cy=(mny+mxy)/2,rx=bw/2||1,ry=bh/2||1,eE=0,eR=0,u=(bw+bh)/4||1;
 p.forEach(function(q){eE+=Math.abs(Math.hypot((q[0]-cx)/rx,(q[1]-cy)/ry)-1);eR+=Math.min(q[0]-mnx,mxx-q[0],q[1]-mny,mxy-q[1])/u;});
 eE/=p.length;eR/=p.length;
 var s=rdp(p,diag*.1),n=s.length-1;
 if(n===3&&eE>.09)return poly(s.slice(0,3),col,w);
 if(eE<eR&&eE<.2)return{t:'h',k:'oval',x1:mnx,y1:mny,x2:mxx,y2:mxy,c:col,w:w};
 if(eR<.15&&(n===4||n===5))return{t:'h',k:'rect',x1:mnx,y1:mny,x2:mxx,y2:mxy,c:col,w:w};
 if(n===4)return poly(s.slice(0,4),col,w);
 return null;}
</script>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i);};
var cv=$('cv'),ctx=cv.getContext('2d'),base=document.createElement('canvas'),bx=base.getContext('2d');
var SH=['line','arrow','rect','oval','tri','dia','star'];
var TOOLS=[['pen','Pen'],['eraser','Eraser'],['line','Line'],['arrow','Arrow'],['rect','Box'],['oval','Oval'],['tri','Triangle'],['dia','Diamond'],['star','Star'],['text','Text'],['stamp','Symbol'],['pan','Pan']];
var COLORS=['#1c1f26','#3b5bdb','#e03131','#2f9e44','#f08c00','#9c36b5'];
var SYMS='✓ ✗ ★ ♥ → ← ↑ ↓ ⇒ ≈ ≠ ≤ ≥ ± ∑ √ π ∞ ° $ % ? ! ① ② ③ ☐ ☑ ⚠ ✎ ⌛ ☺'.split(' ');
var W=0,H=0,dpr=1,ox=0,oy=54,objs=[],undo=[],redo=[],cur=null,ct=null,act=null,snapped=false,erased=false,panS=null;
var tool='pen',color=COLORS[0],size=4,smooth=true,snapOn=true,sym='★',penSeen=false,dirty=true,raf=0,holdT=0,saveT=0,clrT=0,note=null,lastText=null,relay=null;
var ti=$('ti'),bar=$('bar'),symBox=$('sym'),btns={};

function req(){if(!raf)raf=requestAnimationFrame(function(){raf=0;draw();});}
function fit(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;[cv,base].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);});cv.style.width=W+'px';cv.style.height=H+'px';dirty=true;req();}
function mid(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2];}
function strokeP(c,o){
 var p=o.p,n=p.length;if(!n)return;c.strokeStyle=o.c;c.fillStyle=o.c;c.lineCap='round';c.lineJoin='round';
 if(n===1){c.beginPath();c.arc(p[0][0],p[0][1],Math.max(1,o.w*(.35+(p[0][2]||.5)*1.3)/2),0,7);c.fill();return;}
 if(o.sh){c.lineWidth=o.w;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(var i=1;i<n;i++)c.lineTo(p[i][0],p[i][1]);if(o.cl)c.closePath();c.stroke();return;}
 for(var j=1;j<n;j++){
  var s=j===1?p[0]:mid(p[j-2],p[j-1]),e=j===n-1?p[j]:mid(p[j-1],p[j]);
  c.lineWidth=o.w*(.35+(p[j-1][2]||.5)*1.3);c.beginPath();c.moveTo(s[0],s[1]);c.quadraticCurveTo(p[j-1][0],p[j-1][1],e[0],e[1]);c.stroke();}
}
function shapeP(c,o){
 var x1=o.x1,y1=o.y1,x2=o.x2,y2=o.y2,l=Math.min(x1,x2),r=Math.max(x1,x2),t=Math.min(y1,y2),b=Math.max(y1,y2),cx=(l+r)/2,cy=(t+b)/2;
 c.strokeStyle=o.c;c.lineWidth=o.w;c.lineCap='round';c.lineJoin='round';c.beginPath();
 switch(o.k){
  case'line':case'arrow':c.moveTo(x1,y1);c.lineTo(x2,y2);
   if(o.k==='arrow'){var a=Math.atan2(y2-y1,x2-x1),h=12+o.w*2;c.moveTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));c.lineTo(x2,y2);c.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));}break;
  case'rect':c.rect(l,t,r-l,b-t);break;
  case'oval':c.ellipse(cx,cy,(r-l)/2,(b-t)/2,0,0,7);break;
  case'tri':c.moveTo(cx,t);c.lineTo(r,b);c.lineTo(l,b);c.closePath();break;
  case'dia':c.moveTo(cx,t);c.lineTo(r,cy);c.lineTo(cx,b);c.lineTo(l,cy);c.closePath();break;
  case'star':for(var i=0;i<10;i++){var g=-Math.PI/2+i*Math.PI/5,k=i%2?.42:1,px=cx+Math.cos(g)*k*(r-l)/2,py=cy+Math.sin(g)*k*(b-t)/2;if(i)c.lineTo(px,py);else c.moveTo(px,py);}c.closePath();break;}
 c.stroke();
}
function drawObj(c,o){
 if(o.t==='s')strokeP(c,o);else if(o.t==='h')shapeP(c,o);
 else{c.fillStyle=o.c;c.font=o.z+'px system-ui,"Segoe UI Symbol","Apple Symbols",sans-serif';c.textBaseline='middle';c.textAlign=o.a?'center':'left';c.fillText(o.s,o.x,o.y);}
}
function rebuild(){
 bx.setTransform(dpr,0,0,dpr,0,0);bx.fillStyle='#fdfdfc';bx.fillRect(0,0,W,H);bx.fillStyle='#d3d8e3';
 for(var x=((ox%32)+32)%32;x<W;x+=32)for(var y=((oy%32)+32)%32;y<H;y+=32)bx.fillRect(x-.6,y-.6,1.2,1.2);
 bx.save();bx.translate(ox,oy);objs.forEach(function(o){drawObj(bx,o);});bx.restore();dirty=false;
}
function draw(){
 if(dirty)rebuild();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(base,0,0);
 if(cur){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.save();ctx.translate(ox,oy);drawObj(ctx,cur);ctx.restore();}
}
function pushUndo(){undo.push(objs);if(undo.length>80)undo.shift();objs=objs.slice();redo=[];}
function commit(o){pushUndo();objs.push(o);dirty=true;save();}
function doUndo(){if(!undo.length)return;redo.push(objs);objs=undo.pop();dirty=true;save();req();}
function doRedo(){if(!redo.length)return;undo.push(objs);objs=redo.pop();dirty=true;save();req();}
function dist(o,q){
 var x=q[0],y=q[1],i,d=1e9;
 if(o.t==='s'){if(o.p.length===1)return Math.hypot(x-o.p[0][0],y-o.p[0][1]);for(i=1;i<o.p.length;i++)d=Math.min(d,segD(x,y,o.p[i-1][0],o.p[i-1][1],o.p[i][0],o.p[i][1]));return d;}
 if(o.t==='h'){if(o.k==='line'||o.k==='arrow')return segD(x,y,o.x1,o.y1,o.x2,o.y2);
  var l=Math.min(o.x1,o.x2),r=Math.max(o.x1,o.x2),t=Math.min(o.y1,o.y2),b=Math.max(o.y1,o.y2);
  return Math.min(segD(x,y,l,t,r,t),segD(x,y,r,t,r,b),segD(x,y,r,b,l,b),segD(x,y,l,b,l,t));}
 var w=o.s.length*o.z*.6,L=o.a?o.x-w/2:o.x;return(x>=L&&x<=L+w&&Math.abs(y-o.y)<o.z*.6)?0:1e9;
}
function eraseAt(q){var keep=objs.filter(function(o){return dist(o,q)>10;});if(keep.length!==objs.length){if(!erased){pushUndo();erased=true;}objs=keep;dirty=true;save();}}
function pt(e){return[e.clientX-ox,e.clientY-oy,e.pressure>0?e.pressure:.5];}

cv.addEventListener('pointerdown',function(e){
 if(e.pointerType==='pen')penSeen=true;
 if(e.pointerType==='touch'&&penSeen&&tool!=='pan')return;
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(act!==null)return;
 e.preventDefault();symBox.style.display='none';
 try{cv.setPointerCapture(e.pointerId);}catch(_){}
 act=e.pointerId;ct=(e.buttons&32)?'eraser':tool;erased=false;snapped=false;
 var q=pt(e);
 if(ct==='pen')cur={t:'s',p:[q],c:color,w:size};
 else if(SH.indexOf(ct)>-1)cur={t:'h',k:ct,x1:q[0],y1:q[1],x2:q[0],y2:q[1],c:color,w:size};
 else if(ct==='eraser')eraseAt(q);
 else if(ct==='pan')panS={x:e.clientX,y:e.clientY,a:ox,b:oy};
 else if(ct==='text'){openText(q,e.clientX,e.clientY);act=null;}
 else if(ct==='stamp'){commit({t:'x',x:q[0],y:q[1],s:sym,c:color,z:30+size*4,a:1});act=null;}
 req();
});
function doSnap(){if(!cur||cur.t!=='s'||snapped)return;var r=recognize(cur.p,cur.c,cur.w);if(r){cur=r;snapped=true;req();}}
cv.addEventListener('pointermove',function(e){
 if(act!==e.pointerId)return;
 var evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
 evs.forEach(function(ev){
  if(ct==='pen'&&cur&&!snapped){
   var q=pt(ev),l=cur.p[cur.p.length-1];
   if(smooth){q[0]=l[0]+(q[0]-l[0])*.55;q[1]=l[1]+(q[1]-l[1])*.55;}
   if(Math.hypot(q[0]-l[0],q[1]-l[1])>=1)cur.p.push(q);
   clearTimeout(holdT);if(snapOn)holdT=setTimeout(doSnap,550);
  }else if(cur&&cur.t==='h'){var s=pt(ev);cur.x2=s[0];cur.y2=s[1];}
  else if(ct==='eraser')eraseAt(pt(ev));
  else if(ct==='pan'&&panS){ox=panS.a+ev.clientX-panS.x;oy=panS.b+ev.clientY-panS.y;dirty=true;}
 });
 req();
});
function end(e){
 if(act!==e.pointerId)return;clearTimeout(holdT);
 if(cur&&cur.t==='s'){if(!snapped&&smooth&&cur.p.length>2)cur.p=tidy(cur.p);commit(cur);}
 else if(cur&&cur.t==='h'&&Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>4)commit(cur);
 cur=null;act=null;ct=null;panS=null;req();
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function openText(q,sx,sy){
 commitText();var z=14+size*3;
 ti.style.cssText='display:block;left:'+sx+'px;top:'+(sy-z*.7)+'px;font:'+z+'px system-ui,sans-serif;color:'+color+';height:'+(z*1.4)+'px';
 ti.value='';ti._p=q;ti._z=z;ti._c=color;setTimeout(function(){ti.focus();},0);
}
function commitText(){
 if(ti.style.display==='none')return;var s=ti.value.trim(),q=ti._p;ti.style.display='none';ti._p=null;
 if(s&&q){commit({t:'x',x:q[0],y:q[1],s:s,c:ti._c,z:ti._z});req();}
}
ti.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commitText();}else if(e.key==='Escape'){ti.value='';commitText();}e.stopPropagation();});
ti.addEventListener('blur',commitText);

function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none';},3500);}
function mk(label,fn,cls){var b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',fn);bar.appendChild(b);return b;}
function sep(){var s=document.createElement('span');s.className='sep';bar.appendChild(s);}
function sync(){for(var k in btns)btns[k].classList.toggle('on',btns[k]._on());}
TOOLS.forEach(function(t){var b=mk(t[1],function(){tool=t[0];if(tool==='stamp')symBox.style.display=symBox.style.display==='grid'?'none':'grid';else symBox.style.display='none';sync();});b._on=function(){return tool===t[0];};btns['t'+t[0]]=b;if(t[0]==='stamp')btns.stamp=b;});
sep();
COLORS.forEach(function(c){var b=mk('',function(){color=c;sync();},'sw');b.style.background=c;b.setAttribute('aria-label','Colour '+c);b._on=function(){return color===c;};btns['c'+c]=b;});
sep();
[[2,'S'],[4,'M'],[8,'L']].forEach(function(s){var b=mk(s[1],function(){size=s[0];sync();});b._on=function(){return size===s[0];};btns['s'+s[0]]=b;});
sep();
var bs=mk('Smooth',function(){smooth=!smooth;sync();});bs._on=function(){return smooth;};btns.sm=bs;
var bn=mk('Snap shapes',function(){snapOn=!snapOn;sync();});bn._on=function(){return snapOn;};btns.sn=bn;
sep();mk('Undo',doUndo);mk('Redo',doRedo);
var bc=mk('Clear',function(){if(!bc._arm){bc._arm=1;bc.textContent='Sure?';clrT=setTimeout(function(){bc._arm=0;bc.textContent='Clear';},2500);}else{clearTimeout(clrT);bc._arm=0;bc.textContent='Clear';pushUndo();objs=[];dirty=true;save();req();}});
SYMS.forEach(function(s){var b=document.createElement('button');b.type='button';b.textContent=s;b.addEventListener('click',function(){sym=s;tool='stamp';symBox.style.display='none';sync();});symBox.appendChild(b);});
sync();
addEventListener('keydown',function(e){
 if(document.activeElement===ti)return;var k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();if(e.shiftKey)doRedo();else doUndo();}
 else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();doRedo();}
});
addEventListener('resize',fit);

function ser(){return JSON.stringify({v:1,o:objs},function(k,v){return typeof v==='number'?Math.round(v*10)/10:v;});}
function flush(){if(!note||!relay)return;var t=ser();lastText=t;relay.saveItemWithPresave(note,function(){note.content.text=t;note.content.preview_plain='Whiteboard drawing';note.content.preview_html=null;});}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,300);}
function load(t){
 var o=[];
 if(t){try{var j=JSON.parse(t);if(j&&Array.isArray(j.o))o=j.o;else throw 0;}catch(_){toast('This note already has text. Drawing here will replace it.');}}
 objs=o;undo=[];redo=[];cur=null;dirty=true;req();
}
if(typeof ComponentRelay==='function'){
 relay=new ComponentRelay({targetWindow:window,options:{coallesedSaving:true,coallesedSavingDelay:250,acceptsThemes:false},onReady:function(){
  relay.streamContextItem(function(item){
   if(item.isMetadataUpdate)return;
   var t=(item.content&&item.content.text)||'',same=note&&note.uuid===item.uuid;note=item;
   if(same&&t===lastText)return;load(t);});
 }});
}else toast('Standard Notes library missing (dist.js). Drawing will not be saved.');
fit();
})();
</script></body></html>
